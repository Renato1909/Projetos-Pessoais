name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check manifest.json 2>/dev/null || node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
      - run: node --test tests/heuristics.test.js
