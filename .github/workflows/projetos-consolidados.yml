name: Validação dos projetos consolidados

on:
  push:
    branches: [main]
    paths:
      - C/Redes/http-server/**
      - Go/APIs/url-shortener/**
      - Python/APIs/tasks-api/**
      - Python/Redes/lan-scanner/**
      - Python/Seguranca/password-strength-analyzer/**
      - JavaScript/Seguranca/phishing-detector/**
      - TypeScript/Comunicacao/chat-realtime/**
      - .github/workflows/projetos-consolidados.yml
  pull_request:
    branches: [main]
    paths:
      - C/Redes/http-server/**
      - Go/APIs/url-shortener/**
      - Python/APIs/tasks-api/**
      - Python/Redes/lan-scanner/**
      - Python/Seguranca/password-strength-analyzer/**
      - JavaScript/Seguranca/phishing-detector/**
      - TypeScript/Comunicacao/chat-realtime/**
      - .github/workflows/projetos-consolidados.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor-http:
    name: C / Servidor HTTP (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: C/Redes/http-server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar compilador MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
      - name: Compilar servidor
        shell: msys2 {0}
        run: mingw32-make
      - name: Executar testes de integração
        shell: pwsh
        run: ./tests/run-tests.ps1

  encurtador-url:
    name: Go / Encurtador de URLs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Go/APIs/url-shortener
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: Go/APIs/url-shortener/go.mod
          cache-dependency-path: Go/APIs/url-shortener/go.sum
      - name: Analisar código
        run: go vet ./...
      - name: Executar testes com detector de concorrência
        run: go test -race ./...
      - name: Compilar pacotes
        run: go build ./...

  api-tarefas:
    name: Python / API de tarefas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Python/APIs/tasks-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/APIs/tasks-api/pyproject.toml
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verificar estilo e erros estáticos
        run: ruff check .
      - name: Executar testes com cobertura
        run: python -m pytest --cov=app --cov-report=term-missing

  scanner-rede:
    name: Python / Scanner de rede local
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Python/Redes/lan-scanner
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência de testes
        run: python -m pip install pytest
      - name: Executar testes locais e de validação
        run: python -m pytest -v

  analisador-senhas:
    name: Python / Analisador de senhas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Python/Seguranca/password-strength-analyzer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência de testes
        run: python -m pip install pytest
      - name: Executar testes sem consulta externa
        run: python -m pytest -v

  detector-phishing:
    name: JavaScript / Detector de phishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: JavaScript/Seguranca/phishing-detector
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar manifesto da extensão
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
      - name: Executar testes de heurísticas
        run: node --test tests/heuristics.test.js

  chat-tempo-real:
    name: TypeScript / Chat em tempo real
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: TypeScript/Comunicacao/chat-realtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: TypeScript/Comunicacao/chat-realtime/package-lock.json
      - name: Instalar dependências pelo arquivo de lock
        run: npm ci
      - name: Verificar tipos
        run: npx tsc --noEmit
      - name: Executar testes de integração
        run: npm test
